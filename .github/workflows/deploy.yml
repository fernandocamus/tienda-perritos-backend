# Nombre del pipeline
name: CI Pipeline - Backend Tienda Perritos

# Configuración del Trigger del pipeline 
on:
  push:
    # solo cuando se haga push a la rama deploy
    branches:
      - deploy

jobs:
  build-and-push:
    name: Construir y Subir a Amazon ECR

    # Entorno de ejecución de GitHub
    runs-on: ubuntu-latest 

    steps:
    # 1. Clonar el repositorio en el entorno de GitHub Actions
    - name: 1. Descargar el código
      uses: actions/checkout@v4 

    # 2. Autenticación en AWS usando GitHub Secrets para proteger credenciales
    - name: 2. Configurar credenciales seguras de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Requerido para AWS Academy
        aws-region: us-east-1 

    # 3. Obtener el token de acceso para el registro de contenedores de AWS (ECR)
    - name: 3. Iniciar sesión en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 4. Construcción de la imagen Docker y su publicación en la nube
    - name: 4. Construir y publicar imágenes Docker
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        # Imagen Backend
        docker build -t $ECR_REGISTRY/tienda-backend:$IMAGE_TAG .
        docker push $ECR_REGISTRY/tienda-backend:$IMAGE_TAG
        
        # Imagen Base de Datos (Personalizada con init.sql)
        docker build -t $ECR_REGISTRY/tienda-db:$IMAGE_TAG ./db
        docker push $ECR_REGISTRY/tienda-db:$IMAGE_TAG
    # 5. Despliegue automatizado en la instancia EC2 mediante SSH (CD)
    - name: 5. Desplegar en servidor (CD)
      uses: appleboy/ssh-action@master
      with:

        # Configuración de conexión a la instancia en subred privada
        host: ${{ secrets.EC2_PRIVATE_IP }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        
        # Configuración del Bastion Host para saltar a la red privada
        proxy_host: ${{ secrets.BASTION_HOST }}
        proxy_username: ${{ secrets.EC2_USER }}
        proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Login en ECR desde la instancia
          aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          
          # Preparación del directorio de trabajo en el servidor
          mkdir -p ~/backend && cd ~/backend

          # Generación dinámica del archivo docker-compose.yml en el servidor
          cat << 'EOF' > docker-compose.yml
          version: "3.8"
          services:
            backend:

              # Se utiliza la imagen recién subida a ECR para el backend
              image: ${{ steps.login-ecr.outputs.registry }}/tienda-backend:latest
              container_name: tienda-backend
              environment:
                - DB_HOST=db
                - DB_USER=root
                - DB_PASSWORD=admin123
                - DB_NAME=tienda_perritos
              ports:
                - "3001:3001"
              depends_on:
                - db
            db:
              image: ${{ steps.login-ecr.outputs.registry }}/tienda-db:latest
              container_name: tienda-db
              environment:
                - MYSQL_ROOT_PASSWORD=admin123
                - MYSQL_DATABASE=tienda_perritos
              ports:
                - "3306:3306"
              volumes:

                # Configuración de persistencia para no perder datos
                - dbdata:/var/lib/mysql
          volumes:
            dbdata: # Volume para persistencia de base de datos
          EOF

          # Descarga de la última imagen y reinicio de los servicios
          sudo docker compose pull
          sudo docker compose up -d