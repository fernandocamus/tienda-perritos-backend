name: CI Pipeline - Backend Tienda Perritos

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    name: Construir y Subir a Amazon ECR
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código
      uses: actions/checkout@v4 

    - name: 2. Configurar credenciales seguras de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1 

    - name: 3. Iniciar sesión en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: 4. Construir y publicar imagen Docker
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: tienda-backend
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: 5. Desplegar en servidor (CD)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.BASTION_HOST }} # IP Pública
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }} # .pem
        # Comando para actualizar la app en el servidor privado
        script: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_PRIVATE_IP }} << 'ENDSSH'
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            cd ~/backend || mkdir ~/backend && cd ~/backend
            # Aquí va el comando para bajar la imagen nueva y levantarla
            sudo docker pull ${{ steps.login-ecr.outputs.registry }}/tienda-backend:latest
            sudo docker compose up -d
          ENDSSH